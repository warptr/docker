stages:
  - sync

sync-com-to-cn:
  stage: sync
  image: ubuntu:latest
  
  before_script:
    - apt-get update && apt-get install -y skopeo ca-certificates jq curl
    - update-ca-certificates
    # 🌟 每次运行前，去国际版强行拉取最新的 images.txt 覆盖本地
    # 【注意】：请把下面的 URL 换成你刚才复制的国际版 images.txt 的 Raw 链接
    - curl -o images.txt "https://gitlab.com/tmzg0000/docker/-/raw/main/images.txt"
    
  script:
    - set +e
    - |
      if [ ! -f "images.txt" ]; then
        echo "❌ 错误：未能成功从国际版下载 images.txt 文件！"
        exit 1
      fi
      mapfile -t IMAGES < <(tr -d '\r' < images.txt | grep -v '^#' | grep -v '^$')
      
    # ⚠️ 替换为你国际版 (gitlab.com) 的真实用户名
    - COM_REGISTRY="registry.gitlab.com/tmzg0000/docker"
      
    - echo "$CI_REGISTRY_PASSWORD" | skopeo login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - |
      FAILED_COUNT=0
      
      for IMAGE in "${IMAGES[@]}"; do
        IMAGE=$(echo "$IMAGE" | xargs)
        [ -z "$IMAGE" ] && continue
        
        echo "----------------------------------------"
        if [[ "$IMAGE" == ghcr.io/* ]]; then
          REAL_NAME=$(echo "$IMAGE" | sed 's|ghcr.io/||')
        else
          REAL_NAME="$IMAGE"
        fi
        
        SRC_URL="docker://$COM_REGISTRY/$REAL_NAME"
        DEST_URL="docker://$CI_REGISTRY_IMAGE/$REAL_NAME"
        
        echo "正在检查跨境同步: $REAL_NAME"

        SRC_DIGEST=""
        for retry in {1..3}; do
          SRC_DIGEST=$(skopeo inspect --src-tls-verify=false "$SRC_URL" 2>/dev/null | jq -r '.Digest' 2>/dev/null)
          if [ -n "$SRC_DIGEST" ] && [ "$SRC_DIGEST" != "null" ]; then
            break 
          fi
          sleep 1
        done
        
        DEST_DIGEST=$(skopeo inspect "$DEST_URL" 2>/dev/null | jq -r '.Digest' 2>/dev/null)

        if [ -n "$SRC_DIGEST" ] && [ "$SRC_DIGEST" != "null" ] && [ "$SRC_DIGEST" = "$DEST_DIGEST" ]; then
          echo "🍃 大陆端已是最新版本，已优雅跳过。"
        else
          echo "🚀 开始跨海对拷镜像..."
          if skopeo copy --all --src-tls-verify=false "$SRC_URL" "$DEST_URL" || skopeo copy --all --src-tls-verify=false "$SRC_URL" "$DEST_URL"; then
            echo "✅ $IMAGE 跨境对拷成功！"
          else
            echo "❌ 🔴 致命错误: $IMAGE 跨境对拷推流失败！"
            FAILED_COUNT=$((FAILED_COUNT + 1))
          fi
        fi
      done
      
      if [ $FAILED_COUNT -gt 0 ]; then
        echo "========================================"
        echo "统计：同步结束，共有 $FAILED_COUNT 个镜像遇到跨境失败。"
        echo "========================================"
      fi

  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
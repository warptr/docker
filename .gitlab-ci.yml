stages:
  - generate
  - trigger

# 阶段一：动态生成子流水线配置（修复 Token 传递问题）
generate-pipeline:
  stage: generate
  image: alpine:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apk add --no-cache curl
    - curl -o images.txt "https://gitlab.com/tmzg0000/docker/-/raw/main/images.txt"
    - sed -i '/^#/d; /^$/d' images.txt
  script:
    # 1. 初始化头部
    - echo "stages:" > child-pipeline.yml
    - echo "  - sync" >> child-pipeline.yml
    - echo "" >> child-pipeline.yml
    
    # 2. 循环读取列表，直接把当前有效的环境变量塞进子配置中
    - INDEX=0
    - |
      while read -r IMAGE; do
        IMAGE=$(echo "$IMAGE" | xargs)
        [ -z "$IMAGE" ] && continue
        
        REAL_NAME=$(echo "$IMAGE" | sed 's|ghcr.io/||')
        
        echo "sync-job-${INDEX}:" >> child-pipeline.yml
        echo "  stage: sync" >> child-pipeline.yml
        echo "  image: alpine:latest" >> child-pipeline.yml
        echo "  script:" >> child-pipeline.yml
        echo "    - apk add --no-cache skopeo" >> child-pipeline.yml
        # 这里改用显式变量传递，用单引号把值锁死，确保子流水线能拿到正确的临时 Token
        echo "    - echo '${CI_JOB_TOKEN}' | skopeo login registry.jihulab.com -u gitlab-ci-token --password-stdin" >> child-pipeline.yml
        echo "    - echo \"正在同步：${REAL_NAME}\"" >> child-pipeline.yml
        echo "    - skopeo copy --all --src-tls-verify=false --retry-times=5 --retry-delay=3s \"docker://registry.gitlab.com/tmzg0000/docker/${REAL_NAME}\" \"docker://${CI_REGISTRY_IMAGE}/${REAL_NAME}\"" >> child-pipeline.yml
        echo "" >> child-pipeline.yml
        
        INDEX=$((INDEX+1))
      done < images.txt

  artifacts:
    paths:
      - child-pipeline.yml

# 阶段二：触发生成的子流水线
trigger-child-pipeline:
  stage: trigger
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  trigger:
    include:
      - artifact: child-pipeline.yml
        job: generate-pipeline
    strategy: depend
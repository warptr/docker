stages:
  - sync

sync-to-gitlab:
  stage: sync
  image: ubuntu:latest
  
  before_script:
    - apt-get update && apt-get install -y skopeo ca-certificates
    - update-ca-certificates
    
  script:
    - |
      IMAGES=(
        "jxxghp/moviepilot-v2:latest"
        "linuxserver/transmission:4.0.5"
        "linuxserver/qbittorrent:4.6.7"
        "amilys/embyserver:latest"
        "amilys/embyserver_arm64v8:latest"
        "linuxserver/emby:latest"
        "linuxserver/qbittorrent:latest"
        "linuxserver/transmission:latest"
        "nyanmisaka/jellyfin:latest"
        "snowdreamtech/frpc:latest"
        "iyuucn/iyuuplus-dev:latest"
        "dreamacro/clash:latest"
        "haishanh/yacd:latest"
        "metatube/metatube-server:latest"
        "mzz2017/v2raya:latest"
        "redis:latest"
        "postgres:latest"
        "ghcr.io/metacubex/metacubexd:latest"
      )
    - echo "$CI_REGISTRY_PASSWORD" | skopeo login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - |
      for IMAGE in "${IMAGES[@]}"; do
        echo "----------------------------------------"
        # 1. 智能判断源仓库：如果是 ghcr.io 开头，就不拼 docker.io
        if [[ "$IMAGE" == ghcr.io/* ]]; then
          SRC_URL="docker://$IMAGE"
          # 定制在国内保存时的名字（去掉 ghcr.io/ 前缀，方便拉取）
          DEST_NAME=$(echo "$IMAGE" | sed 's|ghcr.io/||' | tr '/' '_')
        else
          SRC_URL="docker://docker.io/$IMAGE"
          # 定制国内保存名字，把中间的斜杠变成下划线，防止极狐多层级报错
          DEST_NAME=$(echo "$IMAGE" | tr '/' '_')
        fi
        
        echo "开始搬运: $SRC_URL -> 目标: $CI_REGISTRY_IMAGE/$DEST_NAME"
        
        # 执行同步
        skopeo copy --all "$SRC_URL" "docker://$CI_REGISTRY_IMAGE/$DEST_NAME"
        
        if [ $? -eq 0 ]; then
          echo "✅ $IMAGE 同步成功！"
        else
          echo "❌ $IMAGE 同步失败！"
        fi
      done

  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
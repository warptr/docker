stages:
  - generate
  - trigger

# 阶段一：使用安全的 EOF 动态生成子流水线配置
generate-pipeline:
  stage: generate
  image: alpine:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apk add --no-cache curl
    - curl -o images.txt "https://gitlab.com/tmzg0000/docker/-/raw/main/images.txt"
    - sed -i '/^#/d; /^$/d' images.txt
  script:
    # 1. 初始化头部
    - echo "stages:" > child-pipeline.yml
    - echo "  - sync" >> child-pipeline.yml
    - echo "" >> child-pipeline.yml
    
    # 2. 循环读取列表，用 EOF 结构绝对安全地拼接生成每一个 Job
    - INDEX=0
    - |
      while read -r IMAGE; do
        IMAGE=$(echo "$IMAGE" | xargs)
        [ -z "$IMAGE" ] && continue
        
        REAL_NAME=$(echo "$IMAGE" | sed 's|ghcr.io/||')
        
        # 使用 cat 追加模式，里面的单双引号、$ 符号全部免转义
        cat << EOF >> child-pipeline.yml
    sync-job-${INDEX}:
      stage: sync
      image: alpine:latest
      script:
        - apk add --no-cache skopeo
        - echo "${CI_REGISTRY_PASSWORD}" | skopeo login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} --password-stdin
        - echo "正在同步：${REAL_NAME}"
        - skopeo copy --all --src-tls-verify=false --retry-times=5 --retry-delay=3s "docker://registry.gitlab.com/tmzg0000/docker/${REAL_NAME}" "docker://${CI_REGISTRY_IMAGE}/${REAL_NAME}"

    EOF
        
        INDEX=$((INDEX+1))
      done < images.txt
  artifacts:
    paths:
      - child-pipeline.yml

# 阶段二：触发生成的子流水线
trigger-child-pipeline:
  stage: trigger
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  trigger:
    include:
      - artifact: child-pipeline.yml
        job: generate-pipeline
    strategy: depend